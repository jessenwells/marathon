<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cast receiver</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        --playback-logo-image: none;
      }
      cast-media-player {
        display: block;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        position: relative;
        --next-preview-visibility: hidden;
        --progress-color: rgba(0, 0, 0, 0);
        --watermark-image: none;
        --watermark-size: 0;
        --watermark-opacity: 0;
        --spinner-image: none;
        --buffering-image: none;
      }
      @keyframes marathon-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      #marathon-preparing-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        pointer-events: none;
      }
      #marathon-preparing-overlay[hidden] {
        display: none;
      }
      .marathon-brand-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .marathon-logo {
        width: min(28vw, 200px);
        height: auto;
        display: block;
      }
      .marathon-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: marathon-spin 1s linear infinite;
      }
    </style>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body>
    <div id="marathon-preparing-overlay" hidden>
      <div class="marathon-brand-stack">
        <picture>
          <source srcset="brand/logo-square.svg" type="image/svg+xml" />
          <img
            src="brand/logo-square.png"
            alt=""
            class="marathon-logo"
            width="200"
            height="200"
          />
        </picture>
        <div class="marathon-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <cast-media-player></cast-media-player>
    <script>
      (function () {
        var preparingOverlay = document.getElementById(
          "marathon-preparing-overlay"
        );
        var forcePreparingOverlay = false;
        var senderConnectedNoMedia = false;
        var playbackStarted = false;

        function setPreparingOverlayVisible(show) {
          if (!preparingOverlay) return;
          if (show) preparingOverlay.removeAttribute("hidden");
          else preparingOverlay.setAttribute("hidden", "");
        }

        function isPlayerLoadingOrBuffering(playerData) {
          var player = document.querySelector("cast-media-player");
          if (!player || !player.shadowRoot) return false;
          var castPlayer =
            player.shadowRoot.querySelector("#castPlayer") ||
            player.shadowRoot.querySelector(".player");
          if (!castPlayer) return false;
          var dataState = castPlayer.getAttribute("data-state");
          if (dataState === "loading" || dataState === "buffering") return true;
          if (playerData && cast.framework.ui && cast.framework.ui.State) {
            var uiState = playerData.state;
            return (
              uiState === cast.framework.ui.State.LOADING ||
              uiState === cast.framework.ui.State.BUFFERING
            );
          }
          return false;
        }

        // Branded overlay: initial Cast connect and show/queue start only — not chapter autoplay or seek.
        function shouldShowPreparingOverlay(playerData) {
          if (forcePreparingOverlay || senderConnectedNoMedia) return true;
          if (!playbackStarted && isPlayerLoadingOrBuffering(playerData)) {
            return true;
          }
          return false;
        }

        function updatePreparingOverlay(playerData) {
          setPreparingOverlayVisible(shouldShowPreparingOverlay(playerData));
        }

        function hasLoadedMedia(pm) {
          try {
            var media = pm.getMediaInformation();
            return media != null && media.contentId != null;
          } catch (e) {
            return false;
          }
        }

        function mediaRequestsPreparingOverlay(media) {
          if (!media || !media.customData) return false;
          var marathon = media.customData.marathon;
          return marathon && marathon.ui === "preparing";
        }
        var PLAYER_SHADOW_CSS =
          ".slideshow, .slideshow.active { display: none !important; }" +
          ".player .logo, .player .splash { color: transparent !important; font-size: 0 !important; }" +
          ".player .background { background-image: none !important; }" +
          "video.mediaElement, #castMediaElement { display: block !important; visibility: visible !important; opacity: 1 !important; }" +
          ".player .spinner," +
          "#castPlayer .spinner," +
          ".spinner," +
          '[class*="spinner"],' +
          '[class*="Spinner"] {' +
          "  display: none !important;" +
          "  visibility: hidden !important;" +
          "  opacity: 0 !important;" +
          "  width: 0 !important;" +
          "  height: 0 !important;" +
          "  pointer-events: none !important;" +
          "}" +
          "video::cue, video::cue(v), ::cue, ::cue(v) {" +
          "  font-family: sans-serif !important;" +
          "  font-weight: 600 !important;" +
          "  color: #ffffff !important;" +
          "  background-color: transparent !important;" +
          "  background: transparent !important;" +
          "  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 8px rgba(0, 0, 0, 0.85) !important;" +
          "}";

        var OVERLAY_SHADOW_CSS =
          "#castControlsTimeline," +
          ".controlsTimeline," +
          "#castControlsProgress," +
          ".controlsProgress," +
          "#castControlsProgressInner," +
          ".controlsProgressInner," +
          "#castControlsSeekable," +
          ".controlsSeekable," +
          "#castControlsSeekablePlayed," +
          ".controlsSeekablePlayed," +
          ".controlsTimelineLabels," +
          "#castControlsCurTime," +
          ".controlsCurTime," +
          "#castControlsTotalTime," +
          ".controlsTotalTime," +
          ".videoLiveIndicator," +
          ".liveIndicator," +
          ".liveLabel," +
          ".progressBar," +
          '[class*="Progress"],' +
          '[class*="Timeline"],' +
          '[class*="CurTime"],' +
          '[class*="TotalTime"] {' +
          "  display: none !important;" +
          "  visibility: hidden !important;" +
          "  opacity: 0 !important;" +
          "  max-height: 0 !important;" +
          "  pointer-events: none !important;" +
          "}" +
          ".controls-metadata," +
          ".metadata," +
          ".media-metadata," +
          ".media-info," +
          ".info-container," +
          ".overlay-metadata," +
          ".overlay-text," +
          ".media-text," +
          ".title-container," +
          ".text-container," +
          ".media-title," +
          ".media-subtitle," +
          ".overlay-title," +
          ".overlay-subtitle," +
          ".title," +
          ".subtitle," +
          ".sub-title," +
          "#metadata," +
          "#overlay-title," +
          ".overlay-image," +
          ".thumbnail," +
          ".media-image," +
          "#overlay-image," +
          ".current-time," +
          ".duration," +
          ".time-label," +
          '[class*="time-label"],' +
          '[class*="metadata"],' +
          '[class*="thumbnail"],' +
          '[class*="Thumbnail"],' +
          '[class*="artwork"],' +
          '[class*="Artwork"] {' +
          "  display: none !important;" +
          "  visibility: hidden !important;" +
          "  opacity: 0 !important;" +
          "  pointer-events: none !important;" +
          "}" +
          ".next-up," +
          '[class*="next-preview"],' +
          '[class*="NextPreview"] {' +
          "  display: none !important;" +
          "}" +
          ".controls-play-pause," +
          ".play-pause," +
          '[class*="play-pause"],' +
          '[class*="PlayPause"] {' +
          "  display: block !important;" +
          "  visibility: visible !important;" +
          "  opacity: 1 !important;" +
          "}" +
          ".spinner," +
          '[class*="spinner"],' +
          '[class*="Spinner"],' +
          ".buffering," +
          '[class*="buffering"],' +
          '[class*="Buffering"],' +
          '[class*="loading-indicator"],' +
          '[class*="LoadingIndicator"] {' +
          "  display: none !important;" +
          "  visibility: hidden !important;" +
          "  opacity: 0 !important;" +
          "  width: 0 !important;" +
          "  height: 0 !important;" +
          "  pointer-events: none !important;" +
          "}" +
          ":host([data-media-category='VIDEO'][data-state='buffering']) .gradient," +
          ":host([data-media-category='VIDEO'][data-state='paused'][data-display-status='false']) .gradient," +
          ":host([data-media-category='VIDEO'][data-state='loading']) .gradient," +
          ":host([data-media-category='VIDEO'][data-state='playing']) .gradient," +
          ":host([data-media-category='VIDEO'][data-state='paused']) .gradient," +
          ".tv-overlay[data-media-category='VIDEO'][data-state='buffering'] .gradient," +
          ".tv-overlay[data-media-category='VIDEO'][data-state='paused'][data-display-status='false'] .gradient," +
          ".gradient," +
          '[class*="gradient"] {' +
          "  display: none !important;" +
          "  visibility: hidden !important;" +
          "  opacity: 0 !important;" +
          "  pointer-events: none !important;" +
          "}";

        function applySubtitleStyle() {
          var ctx = cast.framework.CastReceiverContext.getInstance();
          var ttm = ctx.getPlayerManager().getTextTracksManager();
          if (!ttm || !cast.framework.messages) return;

          var msgs = cast.framework.messages;
          var style = new msgs.TextTrackStyle();
          style.fontGenericFamily = msgs.TextTrackFontGenericFamily.SANS_SERIF;
          style.fontFamily = "sans-serif";
          style.foregroundColor = "#FFFFFFFF";
          style.backgroundColor = "#00000000";
          style.windowType = msgs.TextTrackWindowType.NONE;
          style.windowColor = "#00000000";
          style.edgeType = msgs.TextTrackEdgeType.DROP_SHADOW;
          style.edgeColor = "#000000DD";
          style.fontStyle = msgs.TextTrackFontStyle.BOLD;
          style.fontScale = 1.0;

          try {
            ttm.setTextTrackStyle(style);
          } catch (e) {
            console.warn("[minimal-ui] setTextTrackStyle failed", e);
          }
        }

        // Clear text tracks when new media loads so a previous show's cue
        // does not linger. The Flutter sender sets activeTrackIds on/off.
        function clearActiveSubtitleTracks() {
          var pm = cast.framework.CastReceiverContext.getInstance().getPlayerManager();
          try {
            pm.setActiveTrackIds([]);
          } catch (e) {
            console.warn("[subtitles] clear active tracks failed", e);
          }
        }

        function syncBufferingSpinner(playerData) {
          updatePreparingOverlay(playerData);
        }

        function injectStyle(shadowRoot, styleId, css) {
          if (!shadowRoot) return false;
          var existing = shadowRoot.getElementById(styleId);
          if (existing) {
            existing.textContent = css;
            return true;
          }
          var style = document.createElement("style");
          style.id = styleId;
          style.textContent = css;
          shadowRoot.appendChild(style);
          return true;
        }

        function injectOverlayStyles(tvOverlay) {
          if (!tvOverlay || !tvOverlay.shadowRoot) return false;
          injectStyle(tvOverlay.shadowRoot, "minimal-ui-overlay", OVERLAY_SHADOW_CSS);
          var inner = tvOverlay.shadowRoot.querySelector("overlay, .overlay");
          if (inner && inner.shadowRoot) {
            injectStyle(inner.shadowRoot, "minimal-ui-overlay-inner", OVERLAY_SHADOW_CSS);
          }
          return true;
        }

        var playerData = {};

        function applyMinimalUi() {
          var player = document.querySelector("cast-media-player");
          if (!player || !player.shadowRoot) return false;

          injectStyle(player.shadowRoot, "minimal-ui-player", PLAYER_SHADOW_CSS);
          applySubtitleStyle();
          syncBufferingSpinner(playerData);

          var overlay = player.shadowRoot.querySelector("tv-overlay");
          if (!overlay) return false;
          return injectOverlayStyles(overlay);
        }

        function watchForMinimalUi() {
          var tries = 0;
          var timer = setInterval(function () {
            if (applyMinimalUi() || ++tries > 300) clearInterval(timer);
          }, 100);
        }

        function observePlayerShadow() {
          var player = document.querySelector("cast-media-player");
          if (!player) return;

          function attachObserver() {
            if (!player.shadowRoot) return;
            applyMinimalUi();
            new MutationObserver(function () {
              syncBufferingSpinner(playerData);
              applyMinimalUi();
            }).observe(player.shadowRoot, { childList: true, subtree: true });
            var castPlayer = player.shadowRoot.querySelector("#castPlayer, .player");
            if (castPlayer) {
              new MutationObserver(function () {
                syncBufferingSpinner(playerData);
              }).observe(castPlayer, {
                attributes: true,
                attributeFilter: ["data-state"],
              });
            }
            var tvOverlay = player.shadowRoot.querySelector("tv-overlay");
            if (tvOverlay) {
              new MutationObserver(function () {
                applyMinimalUi();
              }).observe(tvOverlay, {
                attributes: true,
                attributeFilter: ["data-state", "data-display-status"],
              });
            }
          }

          if (player.shadowRoot) attachObserver();
          else customElements.whenDefined("cast-media-player").then(attachObserver);
        }

        var ctx = cast.framework.CastReceiverContext.getInstance();
        var pm = ctx.getPlayerManager();

        ctx.addEventListener(cast.framework.system.EventType.READY, applySubtitleStyle);
        ctx.addEventListener(
          cast.framework.system.EventType.SENDER_CONNECTED,
          function () {
            senderConnectedNoMedia = !hasLoadedMedia(pm);
            updatePreparingOverlay(playerData);
          }
        );
        ctx.addEventListener(
          cast.framework.system.EventType.SENDER_DISCONNECTED,
          function () {
            senderConnectedNoMedia = false;
            forcePreparingOverlay = false;
            playbackStarted = false;
            updatePreparingOverlay(playerData);
          }
        );
        ctx.start();
        watchForMinimalUi();
        observePlayerShadow();

        if (cast.framework.ui && cast.framework.ui.PlayerDataBinder) {
          var binder = new cast.framework.ui.PlayerDataBinder(playerData);
          binder.addEventListener(
            cast.framework.ui.PlayerDataEventType.STATE_CHANGED,
            function () {
              syncBufferingSpinner(playerData);
              applyMinimalUi();
            }
          );
        }

        pm.addEventListener(
          cast.framework.events.EventType.PLAYER_LOADING,
          function () {
            clearActiveSubtitleTracks();
            senderConnectedNoMedia = false;
            syncBufferingSpinner(playerData);
          }
        );
        pm.addEventListener(
          cast.framework.events.EventType.MEDIA_LOADED,
          function (event) {
            if (event && event.media && mediaRequestsPreparingOverlay(event.media)) {
              forcePreparingOverlay = true;
            }
            updatePreparingOverlay(playerData);
          }
        );
        pm.addEventListener(
          cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
          function () {
            applySubtitleStyle();
            forcePreparingOverlay = false;
            senderConnectedNoMedia = false;
            syncBufferingSpinner(playerData);
          }
        );
        pm.addEventListener(cast.framework.events.EventType.BUFFERING, function () {
          syncBufferingSpinner(playerData);
        });
        pm.addEventListener(cast.framework.events.EventType.BUFFERED, function () {
          forcePreparingOverlay = false;
          syncBufferingSpinner(playerData);
        });
        pm.addEventListener(cast.framework.events.EventType.PLAYING, function () {
          playbackStarted = true;
          forcePreparingOverlay = false;
          senderConnectedNoMedia = false;
          updatePreparingOverlay(playerData);
        });
        pm.addEventListener(
          cast.framework.events.EventType.MEDIA_FINISHED,
          function () {
            forcePreparingOverlay = false;
            updatePreparingOverlay(playerData);
          }
        );
      })();
    </script>
  </body>
</html>
